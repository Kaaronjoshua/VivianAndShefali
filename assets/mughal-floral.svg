<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- Repeating Mughal painted-ceiling tile (after Akbar's tomb, Sikandra): gold scrolling vines and blossoms.
       Transparent, so it sits on the navy set in CSS. Tiles seamlessly. -->
  <defs>
    <path id="petal" d="M0 0 C-7 -6 -7 -16 0 -19 C7 -16 7 -6 0 0Z"/>
    <path id="petalIn" d="M0 0 C-4 -4 -4 -10 0 -12 C4 -10 4 -4 0 0Z"/>
    <g id="big">
      <g fill="#d9b45a" stroke="#8a6a2a" stroke-width=".6">
        <use xlink:href="#petal" href="#petal"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(45)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(90)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(135)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(180)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(225)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(270)"/>
        <use xlink:href="#petal" href="#petal" transform="rotate(315)"/>
      </g>
      <g fill="#f4e6c0">
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(22.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(67.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(112.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(157.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(202.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(247.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(292.5)"/>
        <use xlink:href="#petalIn" href="#petalIn" transform="rotate(337.5)"/>
      </g>
      <circle r="4.5" fill="#b85c38"/>
      <circle r="1.8" fill="#f4e6c0"/>
    </g>
    <g id="small">
      <g fill="#f4e6c0">
        <ellipse cy="-3.6" rx="2.4" ry="3.6"/>
        <ellipse cy="-3.6" rx="2.4" ry="3.6" transform="rotate(72)"/>
        <ellipse cy="-3.6" rx="2.4" ry="3.6" transform="rotate(144)"/>
        <ellipse cy="-3.6" rx="2.4" ry="3.6" transform="rotate(216)"/>
        <ellipse cy="-3.6" rx="2.4" ry="3.6" transform="rotate(288)"/>
      </g>
      <circle r="1.6" fill="#d9b45a"/>
    </g>
    <path id="leaf" d="M0 0 C4 -4.5 12 -4.5 16 0 C12 4.5 4 4.5 0 0Z" fill="#d9b45a"/>
    <path id="bud" d="M0 0 C-3 -3 -3 -7 0 -10 C3 -7 3 -3 0 0Z" fill="#b85c38"/>
  </defs>

  <!-- blue speckle, like the painted plaster -->
  <g fill="#5d7fd0" opacity=".45">
    <circle cx="10" cy="90" r="1.2"/><circle cx="44" cy="112" r="1"/><circle cx="58" cy="20" r="1.3"/>
    <circle cx="112" cy="96" r="1.1"/><circle cx="140" cy="118" r="1.3"/><circle cx="160" cy="82" r="1"/>
    <circle cx="190" cy="104" r="1.2"/><circle cx="96" cy="8" r="1"/><circle cx="118" cy="190" r="1.1"/>
    <circle cx="36" cy="186" r="1.3"/><circle cx="150" cy="12" r="1.2"/><circle cx="8" cy="10" r="1"/>
    <circle cx="100" cy="112" r="1"/><circle cx="54" cy="88" r="1.1"/><circle cx="196" cy="186" r="1"/>
  </g>

  <!-- main scrolling vines -->
  <g fill="none" stroke="#d9b45a" stroke-width="1.8" stroke-linecap="round">
    <path d="M0 50 C50 0 50 100 100 50 C150 0 150 100 200 50"/>
    <path d="M0 150 C50 200 50 100 100 150 C150 200 150 100 200 150"/>
  </g>
  <!-- curling stems out to the blossoms -->
  <g fill="none" stroke="#d9b45a" stroke-width="1.2" stroke-linecap="round">
    <path d="M50 50 C40 62 30 70 28 82"/><path d="M50 150 C40 138 30 130 28 118"/>
    <path d="M150 50 C140 62 130 70 128 82"/><path d="M150 150 C140 138 130 130 128 118"/>
    <path d="M100 50 C95 35 85 25 80 18"/><path d="M100 150 C95 165 85 175 80 182"/>
    <path d="M200 50 C195 35 185 25 180 18"/><path d="M200 150 C195 165 185 175 180 182"/>
    <path d="M0 50 C-5 35 -15 25 -20 18"/><path d="M0 150 C-5 165 -15 175 -20 182"/>
    <path d="M70 64 C76 78 90 80 92 72 C94 66 86 64 85 70"/>
    <path d="M70 136 C76 122 90 120 92 128 C94 134 86 136 85 130"/>
    <path d="M170 64 C176 78 190 80 192 72 C194 66 186 64 185 70"/>
    <path d="M170 136 C176 122 190 120 192 128 C194 134 186 136 185 130"/>
    <path d="M30 36 C22 26 30 14 38 18"/><path d="M130 36 C122 26 130 14 138 18"/>
    <path d="M30 164 C22 174 30 186 38 182"/><path d="M130 164 C122 174 130 186 138 182"/>
  </g>
  <!-- leaves along the vines -->
  <use xlink:href="#leaf" href="#leaf" transform="translate(30 36) rotate(-130)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(70 64) rotate(50)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(130 36) rotate(-130)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(170 64) rotate(50)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(30 164) rotate(130)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(70 136) rotate(-50)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(130 164) rotate(130)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(170 136) rotate(-50)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(100 50) rotate(-20)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(100 150) rotate(20)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(0 50) rotate(-20)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(200 50) rotate(-20)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(0 150) rotate(20)"/>
  <use xlink:href="#leaf" href="#leaf" transform="translate(200 150) rotate(20)"/>
  <!-- buds on the curls -->
  <use xlink:href="#bud" href="#bud" transform="translate(38 18) rotate(80)"/>
  <use xlink:href="#bud" href="#bud" transform="translate(138 18) rotate(80)"/>
  <use xlink:href="#bud" href="#bud" transform="translate(38 182) rotate(100)"/>
  <use xlink:href="#bud" href="#bud" transform="translate(138 182) rotate(100)"/>
  <!-- blossoms -->
  <use xlink:href="#big" href="#big" transform="translate(25 100)"/>
  <use xlink:href="#big" href="#big" transform="translate(125 100)"/>
  <use xlink:href="#big" href="#big" transform="translate(75 0) scale(.85)"/>
  <use xlink:href="#big" href="#big" transform="translate(75 200) scale(.85)"/>
  <use xlink:href="#big" href="#big" transform="translate(175 0) scale(.85)"/>
  <use xlink:href="#big" href="#big" transform="translate(175 200) scale(.85)"/>
  <use xlink:href="#small" href="#small" transform="translate(75 100)"/>
  <use xlink:href="#small" href="#small" transform="translate(175 100)"/>
  <use xlink:href="#small" href="#small" transform="translate(85 70) scale(.8)"/>
  <use xlink:href="#small" href="#small" transform="translate(85 130) scale(.8)"/>
  <use xlink:href="#small" href="#small" transform="translate(185 70) scale(.8)"/>
  <use xlink:href="#small" href="#small" transform="translate(185 130) scale(.8)"/>
  <use xlink:href="#small" href="#small" transform="translate(55 100) scale(.7)"/>
  <use xlink:href="#small" href="#small" transform="translate(155 100) scale(.7)"/>
</svg>

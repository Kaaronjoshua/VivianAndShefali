<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation</title>
  <meta name="description" content="You are warmly invited to our wedding.">
  <meta name="theme-color" content="#1f4d45">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
</head>
<body class="locked">

  <!-- ============ ENVELOPE INTRO ============ -->
  <div id="envelope" class="envelope-screen">
    <p class="env-guest" id="guestGreeting"></p>
    <div class="envelope">
      <div class="env-back"></div>
      <div class="env-letter">
        <small>the wedding of</small>
        <span class="script" data-bind="couple"></span>
        <small>you are invited</small>
        <img class="env-dove" src="assets/dove.svg" alt="" aria-hidden="true">
        <p class="env-blessing">With grateful hearts &amp; God&rsquo;s blessing</p>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="env-ribbon" aria-hidden="true"></div>
      <div class="env-tails" aria-hidden="true"></div>
      <button class="seal" id="openBtn" aria-label="Open the invitation"><span data-bind="initials"></span></button>
    </div>
    <p class="env-hint">Tap the seal to open</p>
  </div>

  <button id="musicBtn" class="music-btn" aria-label="Toggle music" hidden>
    <span></span><span></span><span></span><span></span>
  </button>

  <main id="site">
    <!-- ============ TERRACE (first screen after the envelope) ============ -->
    <section class="terrace" id="terrace">
      <div class="terrace-bg" aria-hidden="true"></div>
      <div class="terrace-card reveal">
        <p class="t-lead" data-bind="intro.lead"></p>
        <span class="t-rule" aria-hidden="true"></span>
        <div class="t-person">
          <h1 class="t-name" data-bind="intro.groom.name"></h1>
          <p class="t-role" data-bind="intro.groom.role"></p>
          <p class="t-parents" data-bind="intro.groom.parents"></p>
        </div>
        <p class="t-weds script" data-bind="intro.weds"></p>
        <div class="t-person">
          <p class="t-name" data-bind="intro.bride.name"></p>
          <p class="t-role" data-bind="intro.bride.role"></p>
          <p class="t-parents" data-bind="intro.bride.parents"></p>
        </div>
        <span class="t-rule" aria-hidden="true"></span>
        <p class="t-invite" data-bind="intro.invite"></p>
      </div>
    </section>

    <!-- ============ VERSE (opening) ============ -->
    <section class="verse-sec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.joined.text"></blockquote>
        <figcaption data-bind="verses.joined.ref"></figcaption>
      </figure>
    </section>

    <!-- ============ RING FILM (video frames scrubbed by scroll) ============ -->
    <section class="ring-film" id="ringFilm" hidden>
      <div class="ring-sticky">
        <p class="eyebrow ring-eyebrow">The promise</p>
        <div class="ring-bloom" aria-hidden="true"></div>
        <canvas id="ringCanvas" aria-label="Vivian placing the ring on Shefali's finger"></canvas>
        <div class="ring-captions" id="ringCaptions"></div>
        <div class="ring-progress"><span></span></div>
      </div>
    </section>

    <!-- ============ VERSE (after the ring) ============ -->
    <section class="verse-sec" id="verseSec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.love.text"></blockquote>
        <figcaption data-bind="verses.love.ref"></figcaption>
      </figure>
    </section>

    <!-- ============ INVITE + SCRATCH DATE + COUNTDOWN ============ -->
    <section class="section invite" id="countdown-sec">
      <div class="container reveal">
        <div class="flower-arch">
          <p class="eyebrow">You are invited</p>
          <h2>We request the pleasure of your company on</h2>
        </div>
        <p class="lede scratch-lede">Scratch the gold to reveal our date</p>
        <div class="scratch" id="scratch">
          <div class="coin"><b data-bind="dateDay"></b><span>Day</span></div>
          <div class="coin"><b data-bind="dateMonth"></b><span>Month</span></div>
          <div class="coin"><b data-bind="dateYear"></b><span>Year</span></div>
        </div>
        <button class="link-btn" id="revealAll" type="button">Just show me</button>
        <div class="after-date">
          <p class="lede">at the celebration of our marriage on <strong data-bind="dateLong"></strong></p>
        </div>
      </div>
    </section>

    <!-- ============ VERSE (before our story) ============ -->
    <section class="verse-sec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.beautiful.text"></blockquote>
        <figcaption data-bind="verses.beautiful.ref"></figcaption>
      </figure>
    </section>

    <!-- ============ VERSE (before the celebration) ============ -->
    <section class="verse-sec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.rejoice.text"></blockquote>
        <figcaption data-bind="verses.rejoice.ref"></figcaption>
      </figure>
    </section>

    <!-- ============ EVENTS ============ -->
    <section class="section events">
      <div class="container">
        <p class="eyebrow reveal">When &amp; where</p>
        <h2 class="reveal">The Celebration</h2>
        <div class="event-grid" id="events"></div>
      </div>
    </section>

    <!-- ============ VERSE (after the celebration) ============ -->
    <section class="verse-sec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.unity.text"></blockquote>
        <figcaption data-bind="verses.unity.ref"></figcaption>
      </figure>
    </section>

    <!-- ============ VERSE (before the footer) ============ -->
    <section class="verse-sec">
      <figure class="reveal">
        <span class="verse-orn" aria-hidden="true">&#10022;</span>
        <blockquote class="script" data-bind="verses.ruth.text"></blockquote>
        <figcaption data-bind="verses.ruth.ref"></figcaption>
      </figure>
    </section>

    <footer class="footer">
      <div class="footer-frame">
      <img class="footer-crest" src="assets/lace-crest.svg" alt="" aria-hidden="true">
      <figure class="footer-verse"><blockquote data-bind="verses.closing.text"></blockquote><figcaption data-bind="verses.closing.ref"></figcaption></figure>
      <p class="script" data-bind="couple"></p>
      <p data-bind="dateLong"></p>
      <button class="btn ghost" id="shareBtn" type="button">Share this invitation</button>
      </div>
    </footer>
  </main>

  <canvas id="confetti"></canvas>
  <canvas id="sparkles"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
